name: Build Overlay POC

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish folder build
        run: dotnet publish overlay-poc/OverlayPoc.csproj -c Release -r win-x64 --self-contained true -o overlay-poc/out

      - name: Add instructions
        shell: pwsh
        run: |
          @"
          Overlay POC
          ===========
          1. Extract this whole folder somewhere.
          2. If Windows blocks OverlayPoc.exe: right-click it -> Properties -> check Unblock -> OK.
          3. Run OverlayPoc.exe.
          4. The chat overlay appears at the top center of the primary screen.
          5. It is click-through by default, so clicks reach the app underneath.
          6. Press Ctrl+Shift+O to unlock it ("Lock" button, purple status line).
             - Drag the window by its header.
             - Type in the composer: Enter sends, Shift+Enter adds a line.
             - Press Ctrl+Shift+O again to return to click-through mode.
          7. Header buttons: "-" collapses to the title bar, square maximizes,
             "x" hides to the tray. Restore or exit from the tray icon.

          If nothing appears, open:
            %LOCALAPPDATA%\OverlayPoc\poc.log
          The log records every startup step and any crash.
          "@ | Out-File -Encoding utf8 overlay-poc/out/README.txt

      - name: Zip build
        shell: pwsh
        run: Compress-Archive -Path overlay-poc/out/* -DestinationPath overlay-poc/OverlayPoc.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: overlay-poc-win-x64
          path: overlay-poc/OverlayPoc.zip
          if-no-files-found: error

      - name: Publish test release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: overlay-poc-${{ github.run_number }}
          name: Overlay POC ${{ github.run_number }}
          prerelease: true
          files: overlay-poc/OverlayPoc.zip
